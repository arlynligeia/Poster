<!DOCTYPE html>

<html lang="en">
  
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>ANECHOIC CHAMBER 57 - POSTER</title>
    
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div id="stage"></div>
    <div id="bar">
      <label>Size <select id="size"></select></label>
      <label id="dpiBox">Resolution <select id="dpi">
        <option value="72">72 dpi</option><option value="100">100 dpi</option><option value="150" selected>150 dpi</option><option value="300">300 dpi</option>
        </select>
      </label>      
      <label>Zoom <input id="fov" type="range" min="35" max="110" value="70"></label>
      <button id="save">Save PNG</button>
      <div id="info"></div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
  
</html>
